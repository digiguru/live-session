name: Refresh walkthrough screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capture-walkthroughs.mjs
      - .github/workflows/docs-screenshots.yml

concurrency:
  group: walkthrough-screenshots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Checkout TeamTools preview
        uses: actions/checkout@v7
        with:
          repository: digiguru/TeamTools
          ref: preview
          path: teamtools
      - name: Build TeamTools preview
        working-directory: teamtools
        run: |
          npm install
          npm run build
      - name: Serve TeamTools preview
        working-directory: teamtools
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/teamtools-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/teamtools-preview.log
          exit 1
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:screenshots
        env:
          TEAMTOOLS_URL: http://127.0.0.1:4174
          SKIP_WHEEL: "1"
      - name: Commit refreshed screenshots
        run: |
          if [ -z "$(git status --porcelain -- docs/assets/walkthroughs)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/walkthroughs
          git commit -m "docs: refresh walkthrough screenshots [skip ci]"
          git push
